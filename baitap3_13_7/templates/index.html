<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cảm Biến DHT11 & Điều Khiển LED</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin: 10px; color: white; }
        .btn-on { background-color: #2ecc71; }
        .btn-off { background-color: #e74c3c; }
        .chart-container { width: 100%; height: 400px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>HỆ THỐNG GIÁM SÁT RASPBERRY PI 5</h2>
        <hr>
        
        <h3>ĐIỀU KHIỂN ĐÈN ĐÈN LED (GPIO 17)</h3>
        <p>Trạng thái hiện tại: <strong id="led-text">Updating...</strong></p>
        <button class="btn btn-on" onclick="controlLed('on')">BẬT ĐÈN</button>
        <button class="btn btn-off" onclick="controlLed('off')">TẮT ĐÈN</button>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        // Cấu hình khởi tạo Biểu đồ Chart.js
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Thời gian
                datasets: [
                    { label: 'Nhiệt độ (°C)', data: [], borderColor: '#e74c3c', backgroundColor: 'transparent', yAxisID: 'y' },
                    { label: 'Độ ẩm (%)', data: [], borderColor: '#3498db', backgroundColor: 'transparent', yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Nhiệt độ (°C)' } },
                    y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Độ ẩm (%)' } }
                }
            }
        });

        // Hàm tự động cập nhật dữ liệu từ API của Flask lên biểu đồ
        async function updateChartData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                // Xóa dữ liệu cũ trên biểu đồ
                myChart.data.labels = [];
                myChart.data.datasets[0].data = [];
                myChart.data.datasets[1].data = [];

                // Nạp dữ liệu mới nhận được từ database
                data.forEach(item => {
                    myChart.data.labels.push(item.timestamp.split(' ')[1] || item.timestamp); // Chỉ lấy phần giờ:phút:giây
                    myChart.data.datasets[0].data.push(item.temperature);
                    myChart.data.datasets[1].data.push(item.humidity);
                });
                
                myChart.update(); // Vẽ lại biểu đồ
            } catch (error) {
                console.error("Lỗi cập nhật biểu đồ:", error);
            }
        }

        // Hàm gửi lệnh Bật/Tắt LED về Flask
        async function controlLed(action) {
            try {
                const response = await fetch('/api/led', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                const resData = await response.json();
                if(resData.status === 'success') {
                    document.getElementById('led-text').innerText = resData.led_status === 1 ? "ĐANG BẬT" : "ĐANG TẮT";
                }
            } catch (error) {
                alert("Không thể kết nối đến server điều khiển LED!");
            }
        }

        // Cứ mỗi 3 giây gọi API cập nhật biểu đồ 1 lần
        setInterval(updateChartData, 3000);
        updateChartData(); // Chạy lần đầu ngay khi load trang
    </script>
</body>
</html>
